plugins { id 'com.android.application' }

android {
    namespace 'com.omnigrabber.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.omnigrabber.app'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '1.6.0'
        buildConfigField 'String', 'RAPIDAPI_KEY', '"' + (project.findProperty('rapidApiKey') ?: '') + '"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output -> outputFileName = 'OmniGrabber.apk' }
    }
}

dependencies {
}
