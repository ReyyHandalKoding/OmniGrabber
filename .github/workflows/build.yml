name: Build OmniGrabber
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check RapidAPI configuration
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          if [ -z "$RAPIDAPI_KEY" ]; then
            echo "ERROR: GitHub repository secret RAPIDAPI_KEY belum diisi."
            exit 1
          fi
      - name: Build OmniGrabber
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: gradle assembleDebug --no-daemon --stacktrace -PrapidApiKey="$RAPIDAPI_KEY"
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/OmniGrabber.apk
      - name: Upload OmniGrabber.apk
        uses: actions/upload-artifact@v4
        with:
          name: OmniGrabber-APK
          path: app/build/outputs/apk/debug/OmniGrabber.apk
          if-no-files-found: error
